version: '3.8'

services:
  scheduler:
    build: .
    container_name: news_sentiment_scheduler
    command: python scheduler.py
    volumes:
      - ./data:/app/data
    restart: always

  api:
    build: .
    container_name: news_sentiment_api
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - scheduler
    restart: always

  dashboard:
    build: .
    container_name: news_sentiment_dashboard
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    depends_on:
      - scheduler
    restart: always